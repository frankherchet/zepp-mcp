[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zepp-mcp"
version = "0.1.0"
description = "Self-hosted FastMCP server for Zepp/Amazfit data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Frank Herchet" }]
keywords = ["mcp", "fastmcp", "zepp", "amazfit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=44,<51",
  "fastmcp>=3.4.4,<4",
  "httpx>=0.28.1,<1",
  "platformdirs>=4.0,<5",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
zepp-mcp = "zepp_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/frankherchet/zepp-mcp"
Repository = "https://github.com/frankherchet/zepp-mcp"
Issues = "https://github.com/frankherchet/zepp-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zepp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*"]
follow_untyped_imports = true
